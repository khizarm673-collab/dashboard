name: Collect live feeds and deploy dashboard
on:
  push:
    branches: [main]
    paths-ignore:
      - "live.json"
      - "data/live.json"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# Use a unique group: sharing "pages" with GitHub's internal Pages workflow
# caused deployment runs to cancel one another.
concurrency:
  group: situation-monitor-publish
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect fresh provider data
        run: python3 .github/scripts/fetch_feeds.py

      # Publish the fresh snapshot only in the Pages artifact.
      # Never push generated data back to main: concurrent code commits can
      # make that push non-fast-forward and block the deployment.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
